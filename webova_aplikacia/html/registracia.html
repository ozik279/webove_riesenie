<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reistrácia</title>

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../js/components/search.css">
  <link rel="stylesheet" href="../js/main_logic/downloadToPDFButton.css">
  <link rel="stylesheet" href="../js/components/dynamicNavbar.css">
  <link rel="stylesheet" href="../js/components/logginForm.css">
  <link rel="stylesheet" href="../js/main_logic/validations.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
          crossorigin="anonymous"></script>
  <!-- Font Awesome JS-->
  <script src="https://kit.fontawesome.com/2f3faae799.js" crossorigin="anonymous"></script>

  <script defer type="module" src="../js/login_js/registration.js"></script>
</head>
<body>

  <div class="site-header">
    <div class="container" id="upper-container" style="justify-content: center; flex-direction: row; margin-top: 0">
      <button id="download-pdf-button" class="action-button">
        <i id="pdf-icon" class="fas fa-file-pdf"></i>
      </button>

      <form id="search-bar" style="width: 100%">
        <label for="productSearchInput"></label>
        <input id="productSearchInput" class="form-control" type="text" placeholder="vegan, coca-cola, farmárske kura, slané pečivo, sladkosti, billa...  " autocomplete="off">
        <button type="submit">Vyhľadaj</button>
      </form>

      <button id="login-button" class="action-button">
        <i id="login-icon" class="fa-solid fa-user"></i>
      </button>
    </div>

    <header>

      <!-- Bootstrap 5 Navbar -->
      <nav id="navbar" class="navbar navbar-expand-xxl bg-body-tertiary mb-3 mt-3" style="background-color: yellowgreen !important;">
      </nav>

    </header>
  </div>

<main class="py-3">
  <!-- page content -->

  <div class="loggin-form">
    <form id="registracia-form" novalidate>
      <div class="mb-3">
        <h3 class="mb-3">Registrácia</h3>
        <div style="display: flex; flex-direction: column; width: 80%; margin: auto">

          <label for="email-registracia" class="form-label" style="display: flex">E-mail
            <span style="color: red">*</span>
            <span id="error-message-email-registracia" style="color: red; margin-left: auto; font-size: 0.85rem"></span>
          </label>
          <input type="email" class="form-control" id="email-registracia" aria-describedby="emailHelp">

          <label for="password-registracia" class="form-label mt-3" style="display: flex">Heslo
            <span style="color: red">*</span>
            <span id="error-message-password-registracia" style="color: red; margin-left: auto; font-size: 0.85rem"></span>
          </label>
          <input type="password" class="form-control" id="password-registracia">

          <button id="registracia-button" type="submit" class="btn btn-primary" style="margin-top: 1rem">
            Registrovať sa
          </button>
          <span id="error-message-supabase-registration" style="color: red; font-size: 0.85rem"></span>

          <span class="mt-3" style="font-weight: lighter; font-size: 0.9rem">
                  Aby ste si mohli ukladať produkty a prezerať si ich v záložke moje obľúbené, musíte si
                  vytvoriť účet a prihlásiť sa.
          </span>
        </div>

      </div>
    </form>
  </div>


</main>

  <footer class="site-footer mt-4">
    <div class="d-flex gap-2 pt-2">
      <a class="footer-link" href="mailto:ozaniaklukas@gmail.com">Kontakt</a>
    </div>
  </footer>


</body>
</html>
